name: Test Multi-Platform Build (Qt)
on:
  # Push trigger: also makes the workflow dispatchable (GitHub only
  # registers workflow_dispatch workflows once they exist on the default
  # branch or have been picked up by a push evaluation).
  push:
    branches: [testing]
  workflow_dispatch:

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.tag.outputs.timestamp }}
    steps:
      - name: Generate timestamp
        id: tag
        run: |
          TS=$(date -u +'%Y.%m.%d.%H%M%S')
          echo "timestamp=v${TS}"
          echo "timestamp=v${TS}" >> $GITHUB_OUTPUT

  macos-arm:
    runs-on: macos-14
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake llvm glfw glew pkg-config freetype fontconfig curl qt
      - name: Build Qt host
        run: |
          ./scripts/build.sh --qt --no-run --skip-format
          # find_package degrades SILENTLY when Qt6/Svg is missing (ned_qt
          # skipped) — fail loudly instead of green-building nothing.
          test -x .build/ned_qt.app/Contents/MacOS/ned_qt || \
            test -x .build/ned_qt || { echo "ned_qt binary missing (Qt6 incomplete?)"; exit 1; }
        env:
          CI: true
      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true
      - name: Bundle app (macdeployqt)
        run: |
          # Self-contained .app: Qt frameworks + plugins + resources inside.
          # -always-overwrite: brew dylibs arrive pre-signed; without it the
          # re-sign pass skips nested ones and verification fails.
          # The QtPdf/VirtualKeyboard rpath ERRORs it prints are non-fatal
          # plugin-scan noise (brew qt ships no such frameworks).
          /opt/homebrew/opt/qt/bin/macdeployqt .build/ned_qt.app \
            -always-overwrite -codesign=-
          codesign --force --deep --sign - .build/ned_qt.app
          codesign -v .build/ned_qt.app
          ditto -c -k --keepParent .build/ned_qt.app \
            "NedQt-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}.zip"
      - name: Upload macOS ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NedQt-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}
          path: NedQt-macOS-ARM64-*.zip
          if-no-files-found: error

  debian:
    runs-on: ubuntu-24.04
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang \
            libglfw3-dev libglew-dev libgtk-3-dev \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libssl-dev zlib1g-dev \
            mesa-utils dpkg-dev \
            qt6-base-dev qt6-svg-dev zip
      - name: Build Qt host
        run: |
          export CC=clang
          export CXX=clang++
          ./scripts/build.sh --qt --no-run --skip-format
          # find_package degrades SILENTLY when Qt6/Svg is missing (ned_qt
          # skipped) — fail loudly instead of green-building nothing.
          test -x .build/ned_qt || { echo "ned_qt binary missing (Qt6 incomplete?)"; exit 1; }
        env:
          CI: true
      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NedQt-Debian-${{ needs.create-tag.outputs.timestamp }}
          path: .build/ned_qt
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install Qt (aqtinstall)
        shell: pwsh
        run: |
          pip install aqtinstall
          # python -m: the Scripts dir isn't on PATH for this session;
          # install-qt is the subcommand (aqt-qt is only a legacy alias).
          # 6.8.1: first line with the msvc2022 arch name; MSVC 2022 is
          # binary-compatible with the msvc2019 builds.
          python -m aqt install-qt windows desktop 6.8.1 win64_msvc2022_64 -O C:\Qt
          echo "QT_PREFIX=C:\Qt\6.8.1\msvc2022_64" >> $env:GITHUB_ENV
      - name: Install dependencies and build
        run: .\scripts\build-win-ci.bat
        env:
          CI: true
      - name: Configure, build Qt host, and run tests
        shell: pwsh
        run: |
          $vcpkg = Join-Path $PWD "vcpkg"
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DNED_BUILD_TESTS=ON -DNED_BUILD_QT=ON
          cmake --build build --config Release --target ned_qt --parallel
          cmake --build build --config Release --target ned_tests --parallel
          $bin = Get-ChildItem -Path build -Recurse -Filter ned_tests.exe | Select-Object -First 1
          if (-not $bin) { throw "ned_tests.exe not found" }
          & $bin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter ned_qt.exe | Select-Object -First 1
          if (-not $exe) { throw "ned_qt.exe not found" }
          & "$env:QT_PREFIX\bin\windeployqt.exe" --release $exe.FullName
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NedQt-Windows-x64-${{ needs.create-tag.outputs.timestamp }}
          path: build/**/Release/
          if-no-files-found: error
