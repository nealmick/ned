name: Test Multi-Platform Build
on:
  workflow_dispatch:

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.tag.outputs.timestamp }}
    steps:
      - name: Generate timestamp
        id: tag
        run: |
          TS=$(date -u +'%Y.%m.%d.%H%M%S')
          echo "timestamp=v${TS}"
          echo "timestamp=v${TS}" >> $GITHUB_OUTPUT

  macos-arm:
    runs-on: macos-14
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake llvm glfw glew pkg-config freetype fontconfig curl
      - name: Build
        run: ./scripts/build.sh --no-run --skip-format
        env:
          CI: true
      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true
      - name: Package
        run: |
          ./scripts/pack-mac.sh
          mv Ned.zip "Ned-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}.zip"
      - name: Upload macOS ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ned-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}
          path: Ned-macOS-ARM64-*.zip

  debian:
    runs-on: ubuntu-22.04
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang \
            libglfw3-dev libglew-dev libgtk-3-dev \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libssl-dev zlib1g-dev \
            mesa-utils dpkg-dev
      - name: Build
        run: |
          export CC=clang
          export CXX=clang++
          ./scripts/build.sh --no-run --skip-format
        env:
          CI: true
      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true
      - name: Package
        run: |
          chmod +x scripts/pack-deb.sh
          ./scripts/pack-deb.sh
          mv Ned_*.deb "Ned-Debian-${{ needs.create-tag.outputs.timestamp }}.deb"
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ned-Debian-${{ needs.create-tag.outputs.timestamp }}
          path: Ned-Debian-*.deb

  windows:
    runs-on: windows-2022
    needs: create-tag
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install dependencies and build
        run: .\scripts\build-win-ci.bat
        env:
          CI: true
      - name: Configure and run tests
        shell: pwsh
        run: |
          $vcpkg = Join-Path $PWD "vcpkg"
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DNED_BUILD_TESTS=ON
          cmake --build build --config Release --target ned_tests --parallel
          $bin = Get-ChildItem -Path build -Recurse -Filter ned_tests.exe | Select-Object -First 1
          if (-not $bin) { throw "ned_tests.exe not found" }
          & $bin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ned-Windows-x64-${{ needs.create-tag.outputs.timestamp }}
          path: ned-release/
