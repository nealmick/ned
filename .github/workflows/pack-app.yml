name: Multi-Platform Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ONE release per run: every job uploads to the same timestamped tag
# (softprops/action-gh-release appends assets to an existing release),
# so a push to main produces a single release containing all hosts and
# platforms — Ned-ImGui-* and Ned-Qt-* side by side.

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.tag.outputs.timestamp }}
    steps:
      - name: Generate timestamp
        id: tag
        run: |
          TS=$(date -u +'%Y.%m.%d.%H%M%S')
          echo "timestamp=v${TS}"
          echo "timestamp=v${TS}" >> $GITHUB_OUTPUT

  macos-arm:
    name: ImGui macOS ARM64
    runs-on: macos-14
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake llvm glfw glew pkg-config freetype fontconfig curl

      - name: Build
        run: ./scripts/build.sh --no-run --skip-format
        env:
          CI: true

      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true

      - name: Package
        run: |
          ./scripts/pack-mac.sh
          mv Ned.zip "Ned-ImGui-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}.zip"

      - name: Upload ARM Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-ImGui-macOS-ARM64-*.zip
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  macos-arm-qt:
    name: Qt macOS ARM64
    runs-on: macos-14
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake llvm glfw glew pkg-config freetype fontconfig curl qt

      - name: Build Qt host
        run: |
          ./scripts/build.sh --qt --no-run --skip-format
          # find_package degrades SILENTLY when Qt6/Svg is missing (ned_qt
          # skipped) — fail loudly instead of green-building nothing.
          test -x .build/ned_qt.app/Contents/MacOS/ned_qt || \
            test -x .build/ned_qt || { echo "ned_qt binary missing (Qt6 incomplete?)"; exit 1; }
        env:
          CI: true

      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true

      - name: Package
        run: |
          # Self-contained .app: Qt frameworks + plugins + resources inside.
          # -always-overwrite: brew dylibs arrive pre-signed; without it the
          # re-sign pass skips nested ones and verification fails.
          # The QtPdf/VirtualKeyboard rpath ERRORs it prints are non-fatal
          # plugin-scan noise (brew qt ships no such frameworks).
          /opt/homebrew/opt/qt/bin/macdeployqt .build/ned_qt.app \
            -always-overwrite -codesign=-
          codesign --force --deep --sign - .build/ned_qt.app
          codesign -v .build/ned_qt.app
          ditto -c -k --keepParent .build/ned_qt.app \
            "Ned-Qt-macOS-ARM64-${{ needs.create-tag.outputs.timestamp }}.zip"

      - name: Upload ARM Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-Qt-macOS-ARM64-*.zip
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  debian:
    name: ImGui Debian
    runs-on: ubuntu-22.04
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang \
            libglfw3-dev libglew-dev libgtk-3-dev \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libssl-dev zlib1g-dev \
            mesa-utils dpkg-dev

      - name: Build
        run: |
          export CC=clang
          export CXX=clang++
          ./scripts/build.sh --no-run --skip-format
        env:
          CI: true

      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true

      - name: Package
        run: |
          chmod +x scripts/pack-deb.sh
          ./scripts/pack-deb.sh
          mv Ned_*.deb "Ned-ImGui-Debian-${{ needs.create-tag.outputs.timestamp }}.deb"

      - name: Upload Debian Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-ImGui-Debian-*.deb
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          draft: false
          prerelease: false

  windows:
    name: ImGui Windows x64
    runs-on: windows-2022
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install dependencies and build
        run: .\scripts\build-win-ci.bat
        env:
          CI: true

      # Unit tests (same CMake tree as the Release build when possible)
      - name: Configure and run tests
        shell: pwsh
        run: |
          $vcpkg = Join-Path $PWD "vcpkg"
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DNED_BUILD_TESTS=ON
          cmake --build build --config Release --target ned_tests --parallel
          $bin = Get-ChildItem -Path build -Recurse -Filter ned_tests.exe | Select-Object -First 1
          if (-not $bin) { throw "ned_tests.exe not found" }
          & $bin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          Compress-Archive -Path "ned-release\*" -DestinationPath "Ned-ImGui-Windows-x64-${{ needs.create-tag.outputs.timestamp }}.zip"

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-ImGui-Windows-x64-*.zip
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          draft: false
          prerelease: false

  # Verbatim from test-multi-platform-build-qt.yml (debian job) — only the
  # artifact upload became a release upload, and the package step tars the
  # portable layout CMake stages next to the binary (resources + queries).
  debian-qt:
    name: Qt Debian
    runs-on: ubuntu-24.04
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang \
            libglfw3-dev libglew-dev libgtk-3-dev \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libssl-dev zlib1g-dev \
            mesa-utils dpkg-dev \
            qt6-base-dev qt6-svg-dev zip
      - name: Build Qt host
        run: |
          export CC=clang
          export CXX=clang++
          ./scripts/build.sh --qt --no-run --skip-format
          # find_package degrades SILENTLY when Qt6/Svg is missing (ned_qt
          # skipped) — fail loudly instead of green-building nothing.
          test -x .build/ned_qt || { echo "ned_qt binary missing (Qt6 incomplete?)"; exit 1; }
        env:
          CI: true
      - name: Test
        run: ./scripts/test.sh
        env:
          CI: true
      - name: Package
        run: |
          # Portable layout staged by CMake (same shape as the Windows
          # zip): binary + resources + queries together — without the
          # queries highlighting silently no-ops.
          rm -rf ned-qt-dist && mkdir -p ned-qt-dist
          cp .build/ned_qt ned-qt-dist/
          cp -r .build/resources ned-qt-dist/resources
          cp -r .build/queries ned-qt-dist/queries
          tar -czf "Ned-Qt-Debian-${{ needs.create-tag.outputs.timestamp }}.tar.gz" -C ned-qt-dist .
      - name: Upload Debian Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-Qt-Debian-*.tar.gz
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          draft: false
          prerelease: false

  # Verbatim from test-multi-platform-build-qt.yml (windows job) — only the
  # artifact upload became a release upload (zip via Compress-Archive like
  # the ImGui windows job).
  windows-qt:
    name: Qt Windows x64
    runs-on: windows-2022
    needs: create-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install Qt (aqtinstall)
        shell: pwsh
        run: |
          pip install aqtinstall
          # python -m: the Scripts dir isn't on PATH for this session;
          # install-qt is the subcommand (aqt-qt is only a legacy alias).
          # 6.8.1: first line with the msvc2022 arch name; MSVC 2022 is
          # binary-compatible with the msvc2019 builds.
          python -m aqt install-qt windows desktop 6.8.1 win64_msvc2022_64 -O C:\Qt
          echo "QT_PREFIX=C:\Qt\6.8.1\msvc2022_64" >> $env:GITHUB_ENV
      - name: Install dependencies and build
        run: .\scripts\build-win-ci.bat
        env:
          CI: true
      - name: Configure, build Qt host, and run tests
        shell: pwsh
        run: |
          $vcpkg = Join-Path $PWD "vcpkg"
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DNED_BUILD_TESTS=ON -DNED_BUILD_QT=ON
          cmake --build build --config Release --target ned_qt --parallel
          cmake --build build --config Release --target ned_tests --parallel
          $bin = Get-ChildItem -Path build -Recurse -Filter ned_tests.exe | Select-Object -First 1
          if (-not $bin) { throw "ned_tests.exe not found" }
          & $bin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Qt-only release asset
        shell: pwsh
        run: |
          # build-win-ci.bat (vcpkg bootstrap) also builds the ImGui ned.exe
          # into the same tree — package ONLY the Qt host (the same staging
          # as the test workflow's artifact): fresh dir with the exe +
          # staged resources, then windeployqt adds the Qt DLLs/plugins.
          $exe = Get-ChildItem -Path build -Recurse -Filter ned_qt.exe | Select-Object -First 1
          if (-not $exe) { throw "ned_qt.exe not found" }
          $dir = Split-Path $exe.FullName
          Remove-Item -Recurse -Force ned-qt-dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory ned-qt-dist | Out-Null
          Copy-Item "$dir\ned_qt.exe" ned-qt-dist/
          Copy-Item -Recurse "$dir\resources" ned-qt-dist/resources
          Copy-Item -Recurse "$dir\queries" ned-qt-dist/queries
          & "$env:QT_PREFIX\bin\windeployqt.exe" --release ned-qt-dist\ned_qt.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "ned-qt-dist\*" `
            -DestinationPath "Ned-Qt-Windows-x64-${{ needs.create-tag.outputs.timestamp }}.zip"
      - name: Upload Windows Release
        uses: softprops/action-gh-release@v1
        with:
          files: Ned-Qt-Windows-x64-*.zip
          tag_name: ${{ needs.create-tag.outputs.timestamp }}
          name: "Build ${{ needs.create-tag.outputs.timestamp }}"
          draft: false
          prerelease: false
